backend:
  name: git-gateway
  branch: main # Branch to update (usually main or master)

media_folder: "images/uploads" # Adapted from "public/images/uploads" to fit root structure
public_folder: "/images/uploads"      # How HTML reads them

collections:
  - name: "news" # Used in routes, e.g., /admin/collections/news
    label: "News Articles"
    folder: "content/news" # Where markdown files are stored in your repo
    create: true
    slug: "{{year}}-{{month}}-{{day}}-{{slug}}"
    fields:
      - {label: "Layout", name: "layout", widget: "hidden", default: "news-post"}
      - {label: "Title", name: "title", widget: "string"}
      - {label: "Publish Date", name: "date", widget: "datetime"}
      - {label: "Featured Image", name: "thumbnail", widget: "image"}
      - {label: "Body", name: "body", widget: "markdown"}
